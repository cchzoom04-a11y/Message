<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>醫療科技展校稿平台</title>

<!-- LINE 與社群分享卡片預覽設定 (Open Graph Tags) -->
<meta property="og:type" content="website">
<meta property="og:title" content="醫療科技展校稿平台">
<meta property="og:description" content="此為校稿平台，校稿相關問題可在平台內留言">
<meta property="og:site_name" content="醫療科技展校稿平台">

<style>
:root{--bg:#04182a;--line:#1e6782;--cyan:#54e7d5;--text:#eaf7ff;--muted:#a9c8d9;--amber:#e6ad52;--vendor:#f39c12}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#123c59 0,#04182a 60%) fixed;color:var(--text);font-family:Arial,"Noto Sans TC",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #2d8297;border-radius:10px;background:#0b5268;color:#fff;padding:9px 13px}button:hover{filter:brightness(1.15)}button:disabled{opacity:.5;cursor:default}
button.primary{background:linear-gradient(120deg,#13b9b2,#087b8c);border-color:var(--cyan)}button.ghost{background:transparent}button.danger{border-color:#a44752;background:#612b39}

/* 需求 1：輸入框文字再小一點 (12px) */
input,textarea,select{width:100%;border:1px solid #b9cbd6;border-radius:8px;padding:7px 9px;background:#fff;color:#17354a;font-size:12px}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 4%;background:#06223aee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;flex:1;min-width:220px}.logo{display:grid;place-items:center;width:40px;height:40px;border:2px solid var(--cyan);border-radius:50%;color:var(--cyan)}
.brand small{display:block;font-size:12px;color:#9fc8d8;font-weight:400}.adminbar{display:none;gap:8px;align-items:center;flex-wrap:wrap}.adminbar.show{display:flex}.pill{color:#6de6b7;font-size:12px;border:1px solid #26775f;padding:6px 10px;border-radius:20px}.pill.vendor{color:#f39c12;border-color:#f39c12}
.wrap{max-width:1440px;margin:auto;padding:20px 3% 50px}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#0b2d49ee,#062039f5);border-radius:16px;box-shadow:0 10px 30px #0003}
.banner{position:relative;height:clamp(200px,32vw,380px);overflow:hidden;border-radius:16px;border:1px solid var(--line);background:#082a44}
.banner img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}.banner .cap{position:absolute;left:0;right:0;bottom:0;padding:30px 22px 16px;background:linear-gradient(transparent,#04182acc);pointer-events:none}
.banner h1{margin:4px 0 0;font-size:clamp(20px,2.8vw,32px)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--cyan)}.noimg{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);padding:20px}
.hero{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,.8fr);gap:18px;margin-top:18px}
.zones{padding:18px}.zones h2,.stats h2{margin:0 0 12px;font-size:19px}.zone-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.zone{text-align:left;background:#0b4058;border:1px solid #287b8d;padding:12px;border-radius:12px;display:flex;flex-direction:column;gap:6px}.zone small{color:#a8d2dd;font-size:12px}
.zone.active{background:#0f6a78;border-color:var(--cyan);box-shadow:0 0 0 2px #54e7d577}.bar{height:6px;background:#06243a;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#6de6b7}
.badge{display:inline-block;background:#dc5656;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;margin-left:4px}
.subnav-box{margin-top:14px;padding:12px;background:#06243a;border-radius:10px;border:1px dashed #287b8d}
.subnav-title{font-size:13px;color:var(--cyan);margin-bottom:8px;font-weight:bold}
.subnav-tags{display:flex;gap:8px;flex-wrap:wrap}
.subtag{background:#0b4058;color:var(--text);border:1px solid #287b8d;padding:6px 12px;border-radius:16px;font-size:13px;cursor:pointer}
.subtag.active{background:var(--cyan);color:#04182a;font-weight:bold;border-color:var(--cyan)}
.stats{padding:18px}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#08233a;border:1px solid #245c76;border-radius:12px;padding:12px 6px;text-align:center}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:28px;margin-top:6px}
.stat:nth-child(1) strong{color:var(--amber)}.stat:nth-child(2) strong{color:#62d9f4}.stat:nth-child(3) strong{color:#6de6b7}
.workspace{margin-top:20px;padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.head h2{margin:0;font-size:23px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:16px}.card{background:#f3f8fb;color:#14314a;border-radius:14px;overflow:hidden}

/* 需求 2：抬頭文字再稍微明顯一點 */
.card-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #d8e4ec;flex-wrap:wrap;background:#eef6fc}
.card-head h3{font-size:18px;font-weight:800;color:#0a2942;margin:0;flex:1;min-width:120px;letter-spacing:0.5px}

.tag{font-size:12px;padding:5px 9px;border-radius:20px;background:#dbeafe;color:#214c73;white-space:nowrap;border:0}.tag.pending{background:#ffe2e2;color:#a51e2a}.tag.done{background:#d4f8e8;color:#08784e}
.card-content{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:12px;padding:12px}.preview{background:#dce9f0;border-radius:9px;min-height:200px;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;max-height:340px;object-fit:cover;cursor:zoom-in}
.placeholder{padding:18px;text-align:center;color:#40667b;font-size:13px}.meta{font-size:12px;color:#49677b;margin-top:8px}.thread h4{margin:0 0 6px;font-size:14px}.clist{max-height:230px;overflow:auto}

/* 需求 1：留言文字再大一點 (15px) */
.comment{border-bottom:1px solid #dbe5eb;padding:10px 0;font-size:15px;line-height:1.6;color:#0d263b;overflow-wrap:anywhere}
.comment .m{display:flex;justify-content:space-between;gap:6px;color:#5a768d;font-size:12px;margin-bottom:4px}
.unit{background:#d3e5f2;border-radius:6px;padding:2px 7px;margin-right:5px;color:#143d5e;font-weight:bold}
.comment.sys-log{background:#eaf8ff;border-left:4px solid var(--cyan);padding-left:8px;margin-bottom:6px;border-radius:4px;font-size:14px}

.form{display:grid;gap:6px;margin-top:8px}.form .r{display:grid;grid-template-columns:1fr 1fr;gap:6px}.form button{background:#087b8c}.x{background:none!important;border:0;color:#a51e2a;padding:0 4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 12px}.actions button{color:#087184;background:#fff;border-color:#139ba6;font-size:12px;padding:7px 10px}.actions button.danger{color:#fff}
.empty{padding:40px;text-align:center;color:var(--muted);grid-column:1/-1}.footer{text-align:center;color:#7198ab;font-size:12px;margin-top:22px}
.mb{display:none;position:fixed;inset:0;z-index:100;background:#000c;align-items:center;justify-content:center;padding:16px}.mb.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#f4f9fc;color:#15364d;border-radius:16px;padding:22px}
.modal h2{margin-top:0}.modal label{display:block;font-size:13px;font-weight:bold;margin:12px 0 5px}.modal .act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modal .act button{color:#12364d}.modal .act .primary{color:#fff}.note{font-size:12px;color:#597589;line-height:1.5}

/* 圖檔放大 Lightbox：以原圖解析度載入，縮放時重新取樣，文字保持清晰 */
.lb{display:none;position:fixed;inset:0;z-index:200;background:#020812f5;overflow:hidden;padding:0}.lb.show{display:block}
.lb .t{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:210;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:96vw;background:#06223ae6;padding:8px 14px;border-radius:30px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,0.5);backdrop-filter:blur(8px)}
.lb .t button{background:#0b4058;font-size:13px;padding:6px 12px}
.lb .t .pct{font-size:13px;color:var(--cyan);min-width:52px;text-align:center}
.lb .img-wrapper{width:100vw;height:100vh;overflow:hidden;position:relative;cursor:grab;touch-action:none}
.lb .img-wrapper:active{cursor:grabbing}
.lb img{position:absolute;left:50%;top:50%;max-width:none!important;max-height:none!important;transform-origin:center center;user-select:none;-webkit-user-drag:none;image-rendering:auto;display:none}
.lb .loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--cyan);font-size:15px;background:#06223ae6;border:1px solid var(--line);padding:10px 18px;border-radius:20px;pointer-events:none;display:none}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#062a44;border:1px solid var(--cyan);padding:10px 18px;border-radius:20px;z-index:300;display:none}#demo{display:none;background:#614a1c;color:#ffe3a3;padding:8px 14px;text-align:center;font-size:13px}.hidden{display:none!important}
.breadcrumb{font-size:14px;color:var(--cyan);margin-bottom:10px}
@media(max-width:1000px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:1fr}}
@media(max-width:580px){.card-content{grid-template-columns:1fr}.wrap{padding:12px 10px 40px}}
.drag-tools{display:inline-flex;align-items:center;gap:2px}.drag-handle{cursor:grab;user-select:none;background:#cfe6f1;color:#15506a;border-radius:6px;padding:3px 8px;font-size:13px;font-weight:bold}.drag-handle:active{cursor:grabbing}.mv{background:#cfe6f1!important;color:#15506a!important;border:0!important;padding:3px 7px!important;font-size:12px}
.card.dragging{opacity:.35}.card.over-before{box-shadow:0 -5px 0 #54e7d5}.card.over-after{box-shadow:0 5px 0 #54e7d5}
</style>
</head>
<body>
<div id="demo">此為校稿交流平台 有需修改的部分可以在留言區告知。</div>
<header class="topbar">
  <div class="brand"><div class="logo">✚</div><div>醫療科技展校稿平台</div></div>
  <div class="adminbar" id="adminbar">
    <span class="pill" id="rolePill">管理者模式</span>
    <button id="manageZonesBtn" class="master-only">展區結構管理</button>
    <button id="heroBtn" class="master-only">設定全景圖</button>
    <button id="addBtn" class="master-only">＋新增設計項目</button>
    <button class="ghost" id="logoutBtn">登出</button>
  </div>
  <button id="refreshBtn" class="ghost">↻ 重新整理</button>
  <button id="loginBtn">登入管理員</button>
</header>
<main class="wrap">
  <div class="banner" id="banner"></div>
  <section class="hero">
    <div class="panel zones">
      <h2>展區導覽 <small style="color:var(--muted);font-weight:400;font-size:13px">點選主展區快速展開子頁面與分區</small></h2>
      <div class="zone-grid" id="mainZoneGrid"></div>
      <div id="subZoneContainer"></div>
    </div>
    <aside class="panel stats">
      <h2 id="statTitle">校稿進度總覽</h2>
      <div class="stat-grid">
        <div class="stat"><span>待校稿</span><strong id="sP">0</strong></div>
        <div class="stat"><span>修改中／待複核</span><strong id="sE">0</strong></div>
        <div class="stat"><span>已確認</span><strong id="sD">0</strong></div>
      </div>
      <p style="margin:14px 0 0;font-size:13px;color:var(--muted)" id="statNote"></p>
    </aside>
  </section>
  <section class="panel workspace" id="workspace">
    <div class="breadcrumb" id="breadcrumb"></div>
    <div class="head"><h2 id="listTitle">設計校稿項目</h2><span style="color:var(--muted);font-size:12px">單位留言需填「單位」與「姓名」</span></div>
    <div class="cards" id="cards"></div>
  </section>
  <div class="footer">醫療科技展校稿平台</div>
</main>

<div class="mb" id="mb"><div class="modal"><h2 id="mTitle"></h2><div id="mBody"></div><div class="act"><button id="mCancel">取消</button><button class="primary" id="mOk">確認</button></div></div></div>

<!-- 圖片放大檢視對話框 -->
<div class="lb" id="lb">
  <div class="t">
    <button id="zo">－ 縮小</button>
    <span class="pct" id="zpct">100%</span>
    <button id="zi">＋ 放大</button>
    <button id="zf">符合畫面</button>
    <button id="z1">原始大小</button>
    <button id="lc">關閉 ✕</button>
  </div>
  <div class="img-wrapper" id="lbImgWrapper">
    <img id="lbImg" alt="圖檔放大">
    <div class="loading" id="lbLoading">原圖載入中…</div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ★ 已設定為您的 GAS Web App 網址 ★ */
const GAS_URL = "https://script.google.com/macros/s/AKfycbyA7NlixCRLa6o2GJVdHeP6CB5jXIZWO3A5WB1HEhnDWE-zWnisDt7QbZOmbY8GpdBG/exec";

const DEFAULT_ZONES = [
  {id:"smart", name:"智慧醫療", parentId:"root", level:1},
  {id:"precision", name:"精準醫療", parentId:"root", level:1},
  {id:"humanity", name:"醫學人文", parentId:"root", level:1},
  {id:"simulation", name:"模擬訓練", parentId:"root", level:1},
  {id:"stage", name:"舞台區", parentId:"root", level:1},
  {id:"bigdata", name:"大數據中心", parentId:"smart", level:2},
  {id:"incubation", name:"創新育成中心", parentId:"smart", level:2},
  {id:"infection", name:"感控區", parentId:"incubation", level:3},
  {id:"infant", name:"嬰幼輔具區", parentId:"incubation", level:3},
  {id:"tcm", name:"中醫區", parentId:"incubation", level:3},
  {id:"super", name:"院長室專區", parentId:"incubation", level:3}
];

const STATUS = ["待校稿", "修改中", "待複核", "已確認"];
let db = { items: [], comments: [], zones: [], settings: {} };
let selL1 = "smart", selL2 = "", selL3 = "";
let pw = sessionStorage.getItem("pw") || "";
let role = sessionStorage.getItem("role") || ""; // 'admin' 或 'vendor'
let onOk = null;

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// 需求 5：留言時間簡化為 (2026-10-26 09:00) 格式
function fmtTime(tStr){
  if(!tStr) return "";
  const d = new Date(tStr);
  if(!isNaN(d.getTime())){
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${day} ${hh}:${mm}`;
  }
  return String(tStr);
}

function driveId(u){u=String(u||"");const m=u.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);return m?(m[1]||m[2]):(/^[\w-]{20,}$/.test(u)?u:"")}
// 一般縮圖（卡片預覽、橫幅使用）
function img(u,w=1600){const id=driveId(u);return id?`https://drive.google.com/thumbnail?id=${id}&sz=w${w}`:(u||"")}
// 放大檢視用：依序嘗試 Google Drive「原始檔案」來源，最後才退回高解析縮圖
function fullImgCandidates(u){
  const id = driveId(u);
  if(!id) return u ? [u] : [];
  return [
    `https://lh3.googleusercontent.com/d/${id}=s0`,          // 原始解析度（與 Drive 預覽器相同來源）
    `https://drive.google.com/uc?export=view&id=${id}`,       // 原始檔案
    `https://drive.google.com/thumbnail?id=${id}&sz=w4000`    // 最後備援：高解析縮圖
  ];
}
function toast(t,ms=2200){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);if(ms)toast.t=setTimeout(()=>e.style.display="none",ms)}

async function api(action, p={}){
  if(!GAS_URL) return mock({action, password:pw, ...p});
  const r = await fetch(GAS_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action, password:pw, ...p})});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "操作失敗");
  return j;
}

async function load(){
  try{
    if(!GAS_URL){
      db = JSON.parse(localStorage.demoDB || "null") || seedDemo();
    } else {
      const r = await fetch(GAS_URL + "?action=getAll");
      const j = await r.json();
      if(!j.ok) throw new Error(j.error);
      db = j.data;
    }
    if(!db.zones || !db.zones.length) db.zones = DEFAULT_ZONES;
    render();
  }catch(e){ toast("載入失敗：" + e.message, 5000); }
}

function seedDemo(){
  return {
    items: [
      {id:"i1", sectionId:"infection", title:"感控展區背景看板", description:"請校對文字與標誌位置", imageUrl:"", version:"V01", status:"待校稿"},
      {id:"i2", sectionId:"tcm", title:"中醫海報展示圖", description:"字體大小需調整", imageUrl:"", version:"V01", status:"修改中"}
    ],
    comments: [],
    zones: DEFAULT_ZONES,
    settings: { heroImage:"", heroCaption:"展場全景圖" }
  };
}

function mock(r){
  const d = JSON.parse(localStorage.demoDB || "null") || seedDemo();
  const save = () => localStorage.demoDB = JSON.stringify(d);
  const now = new Date();
  const t = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  if(r.action === "addComment"){
    const c = {id:"c"+Date.now(), itemId:r.itemId, unit:r.unit, name:r.name, text:r.text, time:t};
    d.comments.push(c); 
    if(r.autoConfirm){
      let it = d.items.find(i => i.id === r.itemId);
      if(it) it.status = "已確認";
    }
    save(); return {ok:true, comment:c};
  }
  if(r.action === "adminLogin"){
    if(r.password === "cch8730") return {ok:true, role:"admin"};
    if(r.password === "scdesign") return {ok:true, role:"vendor"};
    throw new Error("密碼錯誤");
  }
  if(r.password !== "cch8730" && r.password !== "scdesign") throw new Error("無權限");
  
  if(r.action === "vendorUpdate"){
    let it = d.items.find(i => i.id === r.id);
    if(it){
      let imageChanged = (r.imageUrl !== undefined && r.imageUrl !== it.imageUrl);
      if(r.imageUrl !== undefined) it.imageUrl = r.imageUrl;
      if(r.version !== undefined) it.version = r.version;
      if(r.status !== undefined) it.status = r.status;
      if(imageChanged){
        d.comments.push({
          id: "c" + Date.now(),
          itemId: r.id,
          unit: "系統紀錄",
          name: r.password === "cch8730" ? "管理者" : "廠商",
          text: `📷 更新了設計圖檔 (版本: ${r.version || 'V01'})`,
          time: t
        });
      }
    }
    save(); return {ok:true};
  }
  if(r.action === "saveItem"){
    let it = d.items.find(i => i.id === r.item.id);
    if(it){
      let imageChanged = (r.item.imageUrl && r.item.imageUrl !== it.imageUrl);
      Object.assign(it, r.item);
      if(imageChanged){
        d.comments.push({
          id: "c" + Date.now(), itemId: r.item.id, unit: "系統紀錄", name: "管理者",
          text: `📷 更新了設計圖檔 (版本: ${r.item.version || 'V01'})`, time: t
        });
      }
    } else {
      const newId = "i" + Date.now();
      d.items.push({...r.item, id: newId});
      if(r.item.imageUrl){
        d.comments.push({
          id: "c" + Date.now(), itemId: newId, unit: "系統紀錄", name: "管理者",
          text: `📷 上傳了設計圖檔 (版本: ${r.item.version || 'V01'})`, time: t
        });
      }
    }
    save(); return {ok:true};
  }
  if(r.action === "reorderItems"){ const m={}; d.items.forEach(i=>m[i.id]=i); const o=(r.ids||[]).filter(i=>m[i]).map(i=>m[i]); d.items.forEach(i=>{ if(!r.ids.includes(i.id)) o.push(i); }); d.items=o; save(); return {ok:true}; }
  if(r.action === "deleteItem"){ d.items = d.items.filter(i=>i.id!==r.id); save(); return {ok:true}; }
  if(r.action === "deleteComment"){ d.comments = d.comments.filter(c=>c.id!==r.id); save(); return {ok:true}; }
  if(r.action === "saveSettings"){ Object.assign(d.settings, r.settings); save(); return {ok:true}; }
  if(r.action === "saveZones"){ d.zones = r.zones; save(); return {ok:true}; }
  save(); return {ok:true};
}

function getAllSubZoneIds(zoneId){
  let result = [zoneId];
  let children = db.zones.filter(z => z.parentId === zoneId);
  children.forEach(c => {
    result = result.concat(getAllSubZoneIds(c.id));
  });
  return result;
}

function getStatsForZone(zoneId){
  const allIds = getAllSubZoneIds(zoneId);
  const items = db.items.filter(i => allIds.includes(i.sectionId));
  return {
    total: items.length,
    p: items.filter(i => i.status === "待校稿").length,
    e: items.filter(i => i.status === "修改中" || i.status === "待複核").length,
    d: items.filter(i => i.status === "已確認").length
  };
}

// 需求 4：新增特製 OK完稿 機制
async function addComment(id){
  const unit = $("u-"+id).value.trim(), name = $("n-"+id).value.trim(), text = $("t-"+id).value.trim();
  if(!unit || !name) return alert("請填寫「單位」與「姓名」");
  if(!text) return alert("請輸入留言內容");

  let isAutoConfirm = false;
  // 檢查是否含有 OK完稿 (忽略大小寫)
  if(/OK完稿/i.test(text)){
    const confirmOk = confirm("是否確認已完成校稿？");
    if(!confirmOk){
      // 按下取消：完全退回，並清空輸入框，停止送出
      $("t-"+id).value = "";
      return;
    }
    isAutoConfirm = true;
  }

  const b = $("b-"+id); b.disabled = true;
  try{
    const r = await api("addComment", {itemId:id, unit, name, text, autoConfirm: isAutoConfirm});
    
    // 前端同步更新該項目狀態為「已確認」
    if(isAutoConfirm){
      let it = db.items.find(i => i.id === id);
      if(it) it.status = "已確認";
      // 確保將狀態改動寫入 GAS 後端
      api("vendorUpdate", {id: id, status: "已確認"}).catch(()=>{});
    }

    if(r.comment) db.comments.push(r.comment);
    localStorage.reviewer = JSON.stringify({unit, name});
    
    // 重新戴入完整最新資料，確保頁面數據正確
    await load(); 
    toast(isAutoConfirm ? "校稿已確認完成並留言！" : "留言已送出");
  } catch(e){ 
    alert(e.message); 
    b.disabled = false; 
  }
}

/* ===== 管理者：拖曳調整設計項目順序 ===== */
let saveChain = Promise.resolve(), dragId = "";
function moveItem(id, targetId, after){
  if(id === targetId) return;
  const from = db.items.findIndex(i => i.id === id); if(from < 0) return;
  const [it] = db.items.splice(from, 1);
  let to = db.items.findIndex(i => i.id === targetId); if(to < 0){ db.items.splice(from, 0, it); return; }
  db.items.splice(after ? to + 1 : to, 0, it);
  render();
  const ids = db.items.map(i => i.id);
  toast("儲存順序中…", 0);
  saveChain = saveChain.then(() => api("reorderItems", {ids})).then(() => toast("順序已儲存")).catch(async e => { alert("順序儲存失敗：" + e.message); await load(); });
}
function stepItem(id, dir){
  const ids = [...document.querySelectorAll("#cards .card[data-id]")].map(e => e.dataset.id);
  const i = ids.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j >= ids.length) return;
  moveItem(id, ids[j], dir > 0);
}
(function(){
  const box = $("cards");
  const clear = () => box.querySelectorAll(".dragging,.over-before,.over-after").forEach(e => e.classList.remove("dragging","over-before","over-after"));
  box.addEventListener("dragstart", e => {
    const h = e.target.closest && e.target.closest(".drag-handle"); if(!h || role !== "admin"){ return; }
    const c = h.closest(".card"); dragId = c.dataset.id; e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", dragId); e.dataTransfer.setDragImage(c, 20, 20);
    setTimeout(() => c.classList.add("dragging"), 0);
  });
  box.addEventListener("dragover", e => {
    if(!dragId) return; const c = e.target.closest(".card"); if(!c) return;
    e.preventDefault(); const r = c.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    box.querySelectorAll(".over-before,.over-after").forEach(x => x.classList.remove("over-before","over-after"));
    if(c.dataset.id !== dragId) c.classList.add(after ? "over-after" : "over-before");
  });
  box.addEventListener("drop", e => {
    if(!dragId) return; const c = e.target.closest(".card"); if(!c) return; e.preventDefault();
    const r = c.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2, id = dragId; dragId = ""; clear();
    moveItem(id, c.dataset.id, after);
  });
  box.addEventListener("dragend", () => { dragId = ""; clear(); });
})();

/* =====================================================================
   圖檔放大 Lightbox（仿 Google Drive 預覽器）
   - 載入「原始解析度」圖檔（不再使用縮圖），文字放大後依然清晰
   - 縮放以「實際像素」為基準：100% = 原始大小，最大可放大到 800%
   - 滾輪以滑鼠位置為中心縮放、拖曳平移、雙擊切換「符合畫面 / 原始大小」
   - 手機支援雙指縮放、單指拖曳
   ===================================================================== */
const lbEl = $("lb"), lbImg = $("lbImg"), lbWrap = $("lbImgWrapper"), lbLoading = $("lbLoading");
let natW = 0, natH = 0;        // 圖片原始像素尺寸
let scale = 1, fitScale = 1;   // scale = 目前縮放比（相對於原始像素），fitScale = 符合畫面時的比例
let panX = 0, panY = 0;
let isDragging = false, startX = 0, startY = 0, moved = false;
let pinchDist = 0, pinchScale = 1;
let lbToken = 0;

const MAX_SCALE = 8;
const minScale = () => Math.min(fitScale * 0.5, 1);
const maxScale = () => Math.max(MAX_SCALE, fitScale * 4);
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);

function updateTransform(){
  lbImg.style.transform = `translate(-50%,-50%) translate(${panX}px,${panY}px) scale(${scale})`;
  $("zpct").textContent = Math.round(scale * 100) + "%";
}

function computeFit(){
  if(!natW || !natH) return 1;
  const vw = window.innerWidth * 0.96, vh = window.innerHeight * 0.86;
  return Math.min(vw / natW, vh / natH, 1);
}

function fitToScreen(){
  fitScale = computeFit();
  scale = fitScale; panX = 0; panY = 0;
  updateTransform();
}

// 以螢幕座標 (cx, cy) 為中心縮放到 newScale
function zoomAt(newScale, cx, cy){
  newScale = clamp(newScale, minScale(), maxScale());
  const rx = cx - window.innerWidth / 2;
  const ry = cy - window.innerHeight / 2;
  const k = newScale / scale;
  panX = rx - (rx - panX) * k;
  panY = ry - (ry - panY) * k;
  scale = newScale;
  updateTransform();
}
const zoomCenter = factor => zoomAt(scale * factor, window.innerWidth / 2, window.innerHeight / 2);

// 依序嘗試多個來源載入原圖
function loadFirstAvailable(urls, token){
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if(token !== lbToken) return reject(new Error("cancelled"));
      if(i >= urls.length) return reject(new Error("fail"));
      const im = new Image();
      im.referrerPolicy = "no-referrer";
      im.onload = () => {
        if(im.naturalWidth > 0) resolve({url: urls[i], w: im.naturalWidth, h: im.naturalHeight});
        else { i++; tryNext(); }
      };
      im.onerror = () => { i++; tryNext(); };
      im.src = urls[i];
    };
    tryNext();
  });
}

function lightbox(u){
  const urls = fullImgCandidates(u);
  if(!urls.length) return;
  const token = ++lbToken;
  natW = natH = 0;
  lbImg.style.display = "none";
  lbImg.removeAttribute("src");
  lbLoading.style.display = "block";
  lbEl.classList.add("show");
  document.body.style.overflow = "hidden";

  loadFirstAvailable(urls, token).then(r => {
    if(token !== lbToken) return;
    natW = r.w; natH = r.h;
    lbImg.referrerPolicy = "no-referrer";
    lbImg.style.width = natW + "px";
    lbImg.style.height = natH + "px";
    lbImg.src = r.url;
    lbImg.style.display = "block";
    lbLoading.style.display = "none";
    fitToScreen();
  }).catch(e => {
    if(e.message === "cancelled") return;
    lbLoading.textContent = "圖片無法載入，請確認 Google Drive 共用權限為「知道連結的任何人」";
  });
}

function closeLightbox(){
  lbToken++;
  lbEl.classList.remove("show");
  lbImg.removeAttribute("src");
  lbImg.style.display = "none";
  lbLoading.textContent = "原圖載入中…";
  lbLoading.style.display = "none";
  document.body.style.overflow = "";
}

$("zi").onclick = e => { e.stopPropagation(); zoomCenter(1.3); };
$("zo").onclick = e => { e.stopPropagation(); zoomCenter(1 / 1.3); };
$("zf").onclick = e => { e.stopPropagation(); fitToScreen(); };
$("z1").onclick = e => { e.stopPropagation(); scale = 1; panX = 0; panY = 0; updateTransform(); };
$("lc").onclick = e => { e.stopPropagation(); closeLightbox(); };

// ESC 關閉、+/- 縮放
window.addEventListener("keydown", e => {
  if(!lbEl.classList.contains("show")) return;
  if(e.key === "Escape") closeLightbox();
  else if(e.key === "+" || e.key === "=") zoomCenter(1.25);
  else if(e.key === "-") zoomCenter(1 / 1.25);
  else if(e.key === "0") fitToScreen();
  else if(e.key === "1") { scale = 1; panX = 0; panY = 0; updateTransform(); }
});

window.addEventListener("resize", () => {
  if(!lbEl.classList.contains("show") || !natW) return;
  const wasFit = Math.abs(scale - fitScale) < 0.0001;
  fitScale = computeFit();
  if(wasFit){ scale = fitScale; panX = 0; panY = 0; }
  updateTransform();
});

// 滑鼠滾輪：以游標位置為中心縮放
lbWrap.addEventListener("wheel", e => {
  e.preventDefault();
  if(!natW) return;
  const factor = Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018));
  zoomAt(scale * factor, e.clientX, e.clientY);
}, { passive: false });

// 滑鼠拖曳平移
lbWrap.addEventListener("mousedown", e => {
  if(e.button !== 0) return;
  isDragging = true; moved = false;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
});
window.addEventListener("mousemove", e => {
  if(!isDragging) return;
  const nx = e.clientX - startX, ny = e.clientY - startY;
  if(Math.abs(nx - panX) + Math.abs(ny - panY) > 2) moved = true;
  panX = nx; panY = ny;
  updateTransform();
});
window.addEventListener("mouseup", () => { isDragging = false; });

// 點擊空白處關閉（拖曳後不觸發）；雙擊圖片切換「符合畫面 / 原始大小」
lbWrap.addEventListener("click", e => {
  if(moved){ moved = false; return; }
  if(e.target === lbWrap) closeLightbox();
});
lbWrap.addEventListener("dblclick", e => {
  if(!natW) return;
  if(Math.abs(scale - fitScale) < 0.01 && fitScale < 1) zoomAt(1, e.clientX, e.clientY);
  else if(Math.abs(scale - fitScale) < 0.01) zoomAt(2, e.clientX, e.clientY);
  else fitToScreen();
});

// 觸控：單指拖曳、雙指縮放
const touchDist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
lbWrap.addEventListener("touchstart", e => {
  if(e.touches.length === 1){
    isDragging = true; moved = false;
    startX = e.touches[0].clientX - panX;
    startY = e.touches[0].clientY - panY;
  } else if(e.touches.length === 2){
    isDragging = false;
    pinchDist = touchDist(e.touches);
    pinchScale = scale;
  }
}, { passive: true });
lbWrap.addEventListener("touchmove", e => {
  e.preventDefault();
  if(e.touches.length === 1 && isDragging){
    panX = e.touches[0].clientX - startX;
    panY = e.touches[0].clientY - startY;
    moved = true;
    updateTransform();
  } else if(e.touches.length === 2 && pinchDist){
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    zoomAt(pinchScale * touchDist(e.touches) / pinchDist, cx, cy);
  }
}, { passive: false });
lbWrap.addEventListener("touchend", e => {
  if(e.touches.length === 0){ isDragging = false; pinchDist = 0; }
  else if(e.touches.length === 1){
    pinchDist = 0; isDragging = true;
    startX = e.touches[0].clientX - panX;
    startY = e.touches[0].clientY - panY;
  }
});

load();
</script>
</body>
</html>
